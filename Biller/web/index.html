<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Viha POS - Enterprise Retail Billing Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Viha POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Viha POS - Enterprise Billing</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Completely hide scrollbars across all browsers */
    ::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
      height: 0px !important;
    }
    * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    body {
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #F1F5F9;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <!-- Instant Native App Loader -->
  <div id="loading" style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F8FAFC;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <img src="favicon.png" width="46" height="46" style="margin-bottom:16px;animation:pulse 1.4s infinite ease-in-out;" />
    <div style="width:26px;height:26px;border:2.5px solid #E2E8F0;border-top-color:#4F46E5;border-radius:50%;animation:spin 0.75s linear infinite;"></div>
    <div style="margin-top:14px;font-size:12px;font-weight:600;color:#0F172A;letter-spacing:0.8px;">VIHA POS</div>
    <div style="margin-top:3px;font-size:10px;color:#64748B;">Loading terminal...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.style.transition = 'opacity 0.2s ease-out';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 200);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
